  roadmap:
    title: Roadmap
    cards:
    - t: KI-Swing-Trader (2. Paper-Konto) — Phase 1 Schatten laeuft
      d: 'Eigener KI-Trader (LLM-Tilt) parallel zur Momentum-Engine, fair gemessen gegen Momentum + SPY/QQQ.
        Phasen - 0 Konto/Trennung, 0.5 News-Coverage-Test (Go/No-Go), 1 Schatten-Signal-Test (IC>0?),
        2 det. Sicherheitskaefig, 3 Live-Paper >=3 Mon, 4 vorregistriertes Urteil nach 24-36 Mon. Lern-System
        nachgelagert. Konzept - AI_SWING_TRADER_CONCEPT.md. Blocker - 2. Alpaca-Konto durch Mert.'
