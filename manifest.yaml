      d: Momentum im Paper-Trading ueber Monate sauber gegen SPY/QQQ tracken — der Edge muss live halten,
        nicht nur im Backtest.
      badge: laufend
    - t: Universum bereits breit (geklaert)
      d: Annahme 'Live-Universum eng/KI-lastig' war FALSCH - das galt der config.yaml-Ringliste, die nur
        Monats-DCA + tote Score-Engine speist. Die Live-Momentum-Engine handelt laengst den breiten
        90-Namen-Korb. Erledigt - als einzige Quelle src/common/universe.py verankert; kein Wechsel noetig.
      badge: erledigt
    - t: Cruft entfernt
      d: Tote Alt-Timer-Units aus Repo UND /etc entfernt (strategy/-open/-close, train-regime, patterns,
        meta-review, rotation = 13 Dateien); rotation-Timer abgeschaltet; Status-Monitoring von Score-Geistern
        befreit. Nichts Totes laeuft mehr - 15 aktive Timer, alle lebend. Score-Code bleibt als Referenz.
      badge: erledigt
    - t: Momentum-Crash-Schutz (offen)
      d: 200d-MA-Regime-Schalter GETESTET und VERWORFEN (whipsaw). Restrisiko 'echter Momentum-Crash'
        (2009-Typ) bleibt ungetestet, da 2018-26 keinen enthielt — billige Absicherung dafuer noch nicht gefunden
        (auch Low-Vol-Beimischung geprueft - diversifiziert echt (Korr 0,26), aber teuer an Rendite und im echten
        Crash-Fall mangels Daten ungetestet). Mitigation bis dahin — Paper bleiben, Live-Beweis ueber echten Zyklus abwarten.
      badge: ungeloest
    - t: Kosten-/Steuer-Realismus
      d: DE-Steuer + Spreads/Slippage im Backtest haerter ansetzen, bevor die Echtgeld-Frage ernst wird.
      badge: geplant
    - t: Echtgeld-Entscheid
      d: Erst nach ueberzeugendem Live-Lauf ueber Zyklen inkl. >=1 Crash — Wertentscheidung von Mert.
      badge: offen · Mert
  decisions:
    title: Entscheidungen (Log)
    cards:
    - t: Keine KI-Firma — stattdessen ehrlich messen und abspecken (mit Abschaltregel)
      d: 'ENTSCHEIDUNG 2026-08-09. Mert hatte vorgeschlagen, das Projekt von einem KI-System wie eine Firma
        managen zu lassen (CEO, CTO, Abteilungen, 24/7-Ueberwachung) und die Entscheidung dann an Claude delegiert.
        ABGELEHNT in dieser Form. BEFUND: Momentum lag am 2026-08-09 bei -2,3 Prozent seit dem 29.04., der
        Markt (SPY) im selben Zeitraum bei +8,9 Prozent — 11,2 Punkte hinten, bei -15 Prozent groesstem Einbruch
        und negativem Sharpe. Der KI-Swing-Trader liegt seit dem 02.07. 4,9 Punkte hinten. Beide verlieren
        Geld in einem STEIGENDEN Markt; das ist kein Pech, sondern ein Konstruktionsfehler. BELEGE GEGEN DIE
        FIRMEN-IDEE: (1) Alpha Arena (nof1.ai) gab Ende 2025 sechs Spitzenmodellen je 10.000 Dollar ECHTES
        Geld — vier von sechs endeten tief im Minus (Claude und Gemini je ueber -40 Prozent, Grok -58 Prozent),
        Ursache durchweg kaputtes Risikomanagement; seit Dezember 2025 gibt es keine neue Runde. (2) Eine
        Untersuchung vom Juli 2026 zeigt, dass Agenten-TEAMS Einzelmodelle nicht zuverlaessig schlagen — bei
        gleichem Denkbudget ist ein Einzelagent meist gleich gut oder besser, und viele Multi-Agent-Systeme
        degenerieren still zu "einer arbeitet, der Rest macht Laerm". (3) Das meistkopierte Vorbild fuer die
        Idee (virattt/ai-hedge-fund, mit Analysten- und Portfoliomanager-Agenten) handelt laut eigener Anleitung
        ueberhaupt nicht echt und hat keine Erfolgsbilanz. (4) Rund 70 Prozent der Strategien, die im Rueckblick
        gut aussehen, fallen live durch — exakt unser Muster (7 von 9 Jahren im Backtest geschlagen, live
        11 Punkte hinten). WAS DER IDEE RECHT GIBT: Der BETRIEB ist nachweislich das, was blutet — ein Circuit-Breaker-Fehlalarm
        fror die Engine 7 Tage ein, eine leere Kurszeile legte die Kursversorgung lahm, zehn Jobs scheiterten
        stumm, und der Marktvergleich war vier Wochen tot ohne dass es auffiel. Dort ist KI-Ueberwachung sinnvoll.
        NEUE LINIE: KI denkt und wacht, REGELN handeln. Keine Instanz entscheidet, welche Aktie gekauft wird.
        Rollen-Titel wie CEO/CTO werden nicht vergeben — ein Sprachmodell traegt keine Verantwortung, es klingt
        nur so. ABSCHALTREGEL (verbindlich, am 2026-08-09 auf Merts Einwand hin VERSCHAERFT): Liegt eine Strategie am 2026-10-31 mehr als 5 Punkte hinter dem SPY, wird sie ABGESCHALTET statt optimiert. Urspruenglich war der 2027-05-01 angesetzt. Mert wandte ein, dass neun weitere Monate zu grosszuegig sind fuer ein System, das in einem STEIGENDEN Markt Geld verliert. Die Gegenprobe stuetzt ihn: zwischen dem 13. und 20.07.2026 verlor das Momentum-Depot 6,5 Prozent, waehrend der Markt nur 0,9 Prozent nachgab — der Rueckstand kommt aus der AKTIENAUSWAHL, nicht aus den Betriebspannen. Damit faellt das Argument weg, ein laengerer Testlauf koenne das Bild drehen. Ueberwacht von scripts/abschalt_check.py (taeglicher Timer, meldet per Telegram sobald der Stichtag erreicht ist). Vorher festgelegt, damit
        das Ergebnis nicht nachtraeglich schoengeredet wird. Voraussetzung dafuer war der Benchmark-Fix am
        selben Tag.'
    - t: Marktvergleich war 4 Wochen tot — Folgeschaden des Circuit-Breaker-Fixes
      d: 'BEFUND + FIX 2026-08-09. Beim Circuit-Breaker-Fix am 2026-07-14 (PR #13, Glitch-Waechter im Equity-Snapshot)
        ging das Befuellen von spy_close verloren. Folge: Ab dem 14.07. schrieb kein Sync-Pfad mehr einen
        Vergleichswert, die Alpha-Berechnung in performance.py lief ins Leere, und das System konnte vier
        Wochen lang nicht sagen, ob es besser oder schlechter als der Markt laeuft. Der KI-Swing-Pfad (ai_swing_sync.py,
        seit 02.07.) hat NIE einen geschrieben. Aufgefallen ist es erst bei der Grundsatz-Diskussion am 09.08.
        FIX: Beide Sync-Pfade schreiben den SPY-Schluss wieder mit, ueber src/common/performance.py::current_spy_close().
        Der Abruf ist fail-soft — faellt Yahoo aus, wird der Snapshot ohne Vergleichswert geschrieben, statt
        den Sync zu kippen. Die Luecke wurde rueckwirkend aus market.db gefuellt (2956 Zeilen), sodass beide
        Strategien eine lueckenlose Messreihe ab ihrem Start haben. LEHRE: Eine Kennzahl, die niemand aktiv
        prueft, kann monatelang tot sein. Die Abschaltregel haengt an genau dieser Zahl.'
    - t: Depot-Teil stillgelegt und an DepotPi übergeben — invest-pi ist wieder reine Strategie
      d: 'ENTSCHEIDUNG 2026-08-10 (Übergabe von DepotPi angefordert, hier umgesetzt). Der gesamte
        Depot-/Sparplan-Teil von invest-pi ist ABGESCHALTET: invest-pi-monthly-dca (Portfolio-Manager,
        haette am 01.09. gefeuert) und invest-pi-dca-watchdog (taeglich 18:00, sparte nebenbei
        LLM-Kosten). WARUM JETZT - Mert bespart seit dem 10.08.2026 zwei provisionsfreie
        Revolut-ETF-Sparplaene (80 EUR VWCE + 20 EUR AHYD). Damit faellt das einzige Gegenargument
        weg, das den Job bisher am Leben hielt ("nicht abschalten, sonst faellt ein Monat aus") -
        der Monatsbeitrag laeuft ohnehin. Der Portfolio-Manager haette am 01.09. eine EINZELAKTIE
        empfohlen und damit gegen die neue Anlagepolitik gearbeitet. DAMIT UEBERHOLT - die
        Entscheidung vom 2026-08-01 ("Aus dem Sparplan wird ein KI-Portfolio-Manager", direkt
        darunter): die Idee war richtig, sie laeuft nur nicht mehr hier, sondern bei DepotPi.
        Ebenso ueberholt - die 1-Gratis-Handel-Randbedingung und die Frage nach der Revolut-Gebuehr;
        beides ist jetzt DepotPis Problem. WIE ABGESCHALTET (zwei Ebenen, mit Absicht) - (1) neues
        Modul src/common/depot_stillgelegt.py, das portfolio_manager.py und dca_watchdog.py sofort
        aussteigen laesst; wirkt auch dann, wenn ein Timer noch scharf ist oder versehentlich wieder
        scharf gemacht wird. (2) systemctl disable der beiden Timer ueber den neuen --disable-Modus
        von systemd_sync.sh (fest verdrahtete Zwei-Unit-Liste, weil das Argument aus einem
        auto-gepullten Repo kommt). Der CODE BLEIBT LIEGEN, als Referenz fuer DepotPi. WAS BLEIBT -
        die Momentum-Engine (Spielgeld), der KI-Swing-Trader und die Abschaltregel zum 2026-10-31.
        Der portfolio-Block in der config.yaml wird NICHT MEHR GEPFLEGT und ist nachweislich falsch
        (VWCE 0,608939 Stueck / 100 EUR statt echter 0,302188 / 50 EUR; UNH 0,1361423 Stueck fehlt
        ganz). Er bleibt eingefroren stehen und /api/dca kennzeichnet ihn in der Oberflaeche als
        veraltet - eine leere Seite haette Mert nicht gesagt, WARUM sie leer ist.'
    - t: Datenverlust-Bug behoben — zwei Timer im selben Repo frassen fremde Commits
      d: 'BEFUND 2026-08-10 (von DepotPi gemeldet, hier nachgewiesen und behoben). Am 01.08.2026 um
        16:38:45 (14:38 UTC) committete der Portfolio-Manager Merts UNH-Kauf in die config.yaml.
        58 Sekunden spaeter war der Commit spurlos weg - kein Fehler, keine Logzeile. BELEG aus dem
        Reflog - 16:39:42 startete auto_pull.sh einen Rebase im selben Arbeitsverzeichnis, 16:39:47
        lief das parallel laufende status_push.sh dadurch in einen Rebase-Konflikt und ging in
        seinen Notausgang "git reset --hard origin/main". Der rettet nur den eigenen
        Status-Snapshot; jeder andere noch nicht gepushte Commit faellt weg. Um 16:40:30 wurde der
        Kauf erneut committet und um 16:41:51 auf demselben Weg ein zweites Mal geloescht.
        URSACHE, zwei Haelften - (1) buy.persist_config_change war "best effort" und hat jeden
        git-Rueckgabewert verschluckt; ob der Push wirklich ankam, hat nie jemand geprueft.
        (2) Beide 2-Minuten-Timer schreiben im selben Repo und haben denselben Hard-Reset als
        Notausgang. FOLGE fuer Mert - seine Depot-Anzeige zeigte zwei Wochen lang einen
        VWCE-Kauf, den es nie gab, und den echten UNH-Kauf gar nicht. BEHOBEN - (1)
        persist_config_change prueft jetzt per merge-base NACH dem Push nach, ob der Commit
        wirklich auf origin/main liegt, versucht es dreimal und schlaegt sonst per Telegram Alarm,
        nachdem es den Commit als Rettungs-Tag gesichert hat. (2) neues scripts/git_rescue.sh, von
        auto_pull.sh und status_push.sh gesourct - es legt vor jedem Hard-Reset alle fremden
        (= nicht "status:") lokalen Commits als Tag beiseite und spielt sie danach per cherry-pick
        zurueck. (3) die wortgleiche Kopie in monthly_dca.py delegiert jetzt an buy.py, statt den
        Fehler ein zweites Mal zu enthalten. WICHTIG - der Bug ist NICHT depot-spezifisch. Er trifft
        alles, was zur Laufzeit eine getrackte Datei schreibt; die Stilllegung des Depot-Teils haette
        ihn nur unsichtbar gemacht, nicht geheilt.'
    - t: ÜBERHOLT (10.08.2026) — Aus dem Sparplan wird ein KI-Portfolio-Manager
      d: 'ÜBERHOLT AM 2026-08-10: der Portfolio-Manager laeuft nicht mehr hier, sondern bei DepotPi
        (s. Eintrag "Depot-Teil stillgelegt" oben). Die Begruendung unten bleibt als Historie stehen.
        ENTSCHEIDUNG 2026-08-01 (Mert). Auf den Befund, dass der Sparplan faktisch nie eine
        Auswahl traf, war die erste Antwort ein besserer Sparplan. Mert hat widersprochen und den
        eigentlichen Projektzweck klargestellt - eine KI soll auswaehlen und verwalten, nicht
        stumpf eine jahrzehntealte Regel auf einen Standard-ETF anwenden. Es soll ein
        PORTFOLIO-MANAGER sein. EINORDNUNG - der frueher belegte Misserfolg der Score-Aera
        widerlegte Kursvorhersage ("welche Aktie steigt naechsten Monat"), NICHT
        Depot-Verwaltung. Verwalten heisst - wissen warum jede Position da ist, monatlich pruefen
        ob der Grund noch gilt, entscheiden wohin neues Geld geht, und wann etwas raus muss. Das
        ist Urteil ueber Zusammenhaenge; genau das kann ein Sprachmodell und eine Momentum-Regel
        prinzipiell nicht. Zur Abgrenzung - DayPi ist ein Intraday-Daytrader (haelt nichts ueber
        Nacht, also das Gegenteil), die Momentum-Engine verwaltet zwar ein ganzes Depot, ist aber
        eine stumpfe Regel auf Spielgeld, und der KI-Swing-Trader ist ein Trader im
        Schattenbetrieb. Keins davon war ein Portfolio-Manager fuers echte Geld.
        DOMINIERENDE RANDBEDINGUNG (Mert, 2026-08-01) - Revolut gibt EINEN GRATIS-HANDEL PRO
        MONAT; jeder weitere kostet bis zu 2 Prozent von 50 EUR. Aktives Umschichten ist damit
        arithmetisch tot. Der Manager trifft deshalb GENAU EINE Entscheidung pro Monat - kaufen,
        verkaufen oder warten. Ein Verkauf verbraucht den Monatshandel und muss sich gegen "einen
        Monat lang investieren" rechnen, wird also nur bei gebrochener Anlage-These gemacht, nie
        wegen eines schlechten Kursmonats. VORGABEN von Mert - Verkaeufe erlaubt, mit Ansage per
        Telegram; max 25 Prozent je EINZELAKTIE, mindestens 4 Positionen. Breite Welt-/Index-ETFs
        sind von der 25-Prozent-Grenze ausgenommen, weil sie in sich gestreut sind - sonst wuerde
        die Regel ausgerechnet aus dem sichersten Baustein draengen (VWCE liegt bei 39,7 Prozent).
        BAUWEISE - die KI schlaegt vor, der CODE erlaubt. Alle Grenzen stehen in
        src/common/pm_rules.py und werden nach der Antwort hart geprueft; ein Verstoss faellt auf
        "diesen Monat nicht handeln" zurueck, statt die Grenze zu reissen. Neu -
        src/common/pm_context.py (vollstaendiges Lagebild - Depot mit Gewinn/Verlust und Gewicht,
        Bewertungskennzahlen, Quartalstermine, Nachrichten-Stimmung, Konjunktur, Marktbreite,
        Regime, Korrelation der eigenen Positionen; all das lag im Projekt bereits herum und wurde
        vom Sparplan nie benutzt), src/common/thesis_store.py (je Position eine Anlage-These PLUS
        ein pruefbares Widerlegungs-Kriterium, das jeden Monat wieder vorgelegt wird),
        scripts/portfolio_manager.py. Der Timer invest-pi-monthly-dca zeigt jetzt auf den Manager;
        der Unit-NAME bleibt absichtlich stehen, weil status_push.sh daran haengt.
        KOSTEN - ein Lauf kostet gemessen 0,22 EUR im Monat. Die Stunden-Bremse stand auf 0,20 EUR
        und haette den Job dauerhaft blockiert; sie wurde auf 0,60 EUR angehoben. Tages- (2 EUR)
        und Monatsgrenze (50 EUR) bleiben unveraendert.'
    - t: Monats-Sparplan bekommt eine echte Auswahlgrundlage — VWCE war ein Zwangsergebnis, keine Entscheidung
      d: 'BEFUND 2026-08-01 (Mert fragte, warum wieder VWCE vorgeschlagen wurde, obwohl der Kurs
        gerade nachgibt). Der Sparplan lief technisch fehlerfrei, traf aber faktisch keine Auswahl.
        Ursache - die Kandidatenliste kam aus den daily_score-Risk-Scores der letzten 24 Stunden.
        Diese Scores erzeugte zuletzt nur noch der DCA-Waechter um 18:00, und der bewertet
        ausschliesslich die BEREITS gehaltenen Positionen; der eigentliche Universum-Scan
        (invest-pi-score) ist seit Juni abgeschaltet. Die Liste bestand damit dauerhaft aus vier
        Werten (NVDA, ASML, PG, SPY). Die Kaufregel verlangte mindestens zwei Kandidaten mit
        composite unter 30 und Alarmstufe 0 — praktisch nie erfuellbar, also jeden Monat
        ETF-Rueckfall auf VWCE. Juli und August identisch. Die Telegram-Begruendung las sich wie
        eine Abwaegung, beschrieb aber eine Sackgasse. ZWEITER BEFUND - es wurde nie gemessen, ob
        die Empfehlungen besser waren als stumpf den Welt-ETF zu kaufen; damit war die Leitfrage
        des Projekts unbeantwortbar. ENTSCHEIDUNG - (1) neues Modul src/common/market_scan.py
        scannt lokal die rund 90 Large Caps des Momentum-Universums plus die drei Revolut-ETFs
        (Momentum 1/3/6/12 Monate, 12-1-Momentum, Abstand zum 200-Tage-Schnitt, Ruecksetzer vom
        52-Wochen-Hoch, Schwankung, Sektor) — keine LLM-Kosten, Abdeckung aktuell 87 von 90;
        (2) neue Entscheidungsregel beruecksichtigt ausdruecklich, dass dieser Sparplan KEINE
        Rotationsregel hat - Einzeltitel nur bei durch 12-1-Momentum bestaetigtem Trend, tragbarer
        Schwankung und ohne Sektor-Klumpen, sonst ETF; (3) neues Modul src/common/dca_benchmark.py
        schreibt je Kauf den Einstiegskurs UND den gleichzeitigen VWCE-Kurs mit und rechnet
        Trefferquote, Differenz in Prozentpunkten und Euro-Effekt aus — Monate ohne echte
        Entscheidung zaehlen ehrlich als 0,0 Prozentpunkte. Die Bilanz steht ab sofort in jeder
        Sparplan-Nachricht. Der alte Score-Pfad bleibt nur noch als Zusatz-Info erhalten.
        NEBENBEFUND - Merts Praemisse stimmte nicht: VWCE lag -1,2 Prozent auf einen Monat, aber
        +19,9 Prozent auf zwoelf Monate und 7,4 Prozent ueber dem 200-Tage-Schnitt. Fallende Kurse
        sind fuer einen Sparplan ohnehin kein Aussetz-Grund, das steht jetzt explizit im Prompt.'
    - t: PANNE 2026-08-01 — versehentlicher Zweitlauf des Sparplans, UNH-Fehlbuchung
      d: 'Beim Umbau lief ein Test mit --dry-run versehentlich als Echtlauf, weil der Schalter zu
        dem Zeitpunkt noch nicht in der Datei auf der Platte war - der auto_pull-Timer hatte genau
        diesen Teil-Edit zurueckgedreht, waehrend andere Edits derselben Datei ueberlebten. Die
        alte __main__-Zeile ignorierte das Argument stillschweigend. Folge - eine zweite
        August-Buchung (UNH 50 EUR bei 421,02) im Sparplan-Ledger plus ein Telegram-Vorschlag an
        Mert. Beides ungueltig, UNH wurde wieder entfernt; der August-Sparplan ist mit VWCE
        erledigt. LEHRE - bei Skripten mit echten Seiteneffekten den Schutzschalter gegen die
        Datei auf der Platte pruefen, nicht gegen den zuletzt geschriebenen Edit; besser nur die
        neuen Funktionen einzeln testen, ohne den Buchungspfad zu betreten.'
    - t: DCA-Depot kommt jetzt aus der config.yaml statt aus dem Empfehlungs-Protokoll
      d: 'BEFUND 2026-07-27 (Mert per Broker-Screenshot) - das DCA-Depot im Dashboard stimmte nicht.
        Ursache - /api/dca baute das Depot aus dem Empfehlungs-Protokoll zusammen (alle
        feedback_reasons vom Typ dca_bought), also aus "was hat das System vorgeschlagen und wurde
        als gekauft markiert" statt aus dem echten Bestand. Das MUSS driften, sobald Mert etwas
        anderes kauft als vorgeschlagen oder etwas verkauft. Konkret vier Fehler - (1) ORCL stand
        noch mit -32% im Depot, obwohl am 10.07. verkauft; der Verkauf war als dca_sold sauber
        protokolliert, der Endpunkt fragte nur nie danach; (2) im Juli stand SPY drin, gekauft
        wurde VWCE - der Protokoll-Eintrag nannte sogar noch ein drittes Papier (XLV); (3) jede
        Position wurde pauschal mit 50 EUR angesetzt statt mit echten Stueckzahlen; (4) ASML wurde
        ueber die US-Variante bepreist (~1803 USD), gehalten wird die Amsterdamer in EUR (~1585) ->
        ~5% falscher Wert. Summe Dashboard 256,37 EUR vs Broker 229,84 EUR. FIX - Quelle ist jetzt
        der portfolio-Block der config.yaml (laut CLAUDE.md ohnehin die einzige Wahrheitsquelle
        fuer Depot-Daten); das Protokoll liefert nur noch die Begruendung zur Position. Verkaufte
        Positionen erscheinen getrennt als "closed", statt zu verschwinden - ein Fehlgriff, den man
        wegrechnet, verfaelscht die Frage, ob das System den Markt schlaegt. Neu ausserdem
        yf_symbol je Position (Boersenplatz != config-Schluessel) und die fehlenden Stueckzahlen
        fuer ASML/NVDA aus Merts Broker-Ansicht nachgetragen. NACHTRAG (gleicher Tag, Mert meldete
        weiterhin falsche Summe) - zwei Restfehler - (a) der Einstand war pauschal 4x50=200 EUR
        angesetzt, tatsaechlich hat Mert bei NVDA 51,08 und bei PG 50,83 eingezahlt, echter
        Einstand also 201,91 EUR; (b) der freie Saldo (0,10 EUR) fehlte ganz, der Broker zeigt als
        "Depotkonto" aber Positionen PLUS Saldo. Beides korrigiert, Saldo als settings.dca_cash_eur;
        er geht bewusst NICHT in Einstand/Rendite ein - uninvestiertes Geld hat keine Rendite.
        BELEGT - Einstand jetzt exakt 201,91 EUR wie beim Broker, Depotkonto-Summe auf 0,33 EUR
        genau (0,14%, reines Kurs-Timing: PG fiel zwischen Screenshot und Abruf um 1,74 USD).
        Lehre - ein Soll-Protokoll ist kein Ist-Bestand; wer beides vermischt, zeigt Positionen an,
        die es nicht gibt. Und Budget != Einstand - was Mert einzahlen WOLLTE ist nicht, was die
        Position gekostet hat.'
      badge: 2026-07-27
    - t: Eine leere Yahoo-Kurszeile legte die gesamte Kursversorgung lahm - entschaerft
      d: 'BEFUND 2026-07-27 (Routine-Check) - von 90 Titeln waren 0 bewertbar, die Kursversorgung
        war komplett tot. Ursache - Yahoo lieferte fuer Fr 24.07. eine Zeile mit Volumen, aber
        OHLC=NaN. Kette - _save_to_cache mappt NaN auf None, market.db hat NOT NULL auf close ->
        IntegrityError -> get_prices fliegt raus -> momentum_ranking faengt das per "except:
        continue" ab -> Datenabdeckung 0%. EINE kaputte Zeile eines Fremdanbieters riss also
        alle 90 Ticker mit. Wirkung - der Monats-Rebalance am 01.08. waere mit "zu wenig Daten"
        abgebrochen (immerhin laut, mit OnFailure-Alarm, kein stiller Freeze wie im Juli);
        /api/benchmark und /api/ai-swing/performance lieferten bereits 500 (NaN ist nicht
        JSON-kodierbar). Am Sonntag lief noch alles, weil der Cache als frisch galt und gar
        nicht aufgefrischt wurde - der Ausfall begann erst mit dem ersten fehlenden Handelstag.
        FIX - (1) _drop_incomplete_bars filtert Zeilen ohne Schlusskurs zentral in
        _rate_limited_fetch, also auf JEDEM yfinance-Pfad (voll + inkrementell); (2) zweiter
        Riegel in _save_to_cache laesst solche Zeilen aus, statt den ganzen INSERT platzen zu
        lassen; (3) beide SPY-Abrufe in der Webapp filtern NaN vor der Berechnung. Belegt -
        Datenabdeckung 0% -> 98%, Rebalance laeuft wieder durch. Die DB blieb sauber, die
        NOT-NULL-Sperre hatte die Daten geschuetzt (nur eben um den Preis des Absturzes).
        Lehre - Fremddaten koennen syntaktisch gueltig und inhaltlich leer sein; Filtern gehoert
        an die EINE Stelle, durch die alle Abrufe laufen, nicht in jeden Aufrufer.'
      badge: 2026-07-27
    - t: Job-Liste der Systemseite kommt jetzt aus systemd statt aus einer Handliste
      d: 'BEFUND 2026-07-27 - die Systemseite der Webapp pruefte eine hartkodierte Job-Liste, die
        nicht mehr stimmte - 5 Jobs existierten laengst nicht mehr, "invest-pi-strategy" hiess
        real "invest-pi-strategy-hourly", und alle 4 ai-swing-Jobs plus operator/monthly-digest
        fehlten ganz. Folge - der wichtigste Job stand dauerhaft auf Rot, obwohl er sauber lief,
        daneben 5 Geister-Jobs ebenfalls Rot. FIX - die Liste wird per systemctl list-unit-files
        aus systemd selbst gelesen, kann also nicht mehr veralten (20 Jobs erkannt, korrekt nur
        invest-pi-score als AUS). Lehre - Dauer-Rot macht einen echten Ausfall unsichtbar; eine
        Statusanzeige, die man von Hand nachpflegen muss, ist auf Dauer schlimmer als keine.'
      badge: 2026-07-27
    - t: Circuit-Breaker-Fehlalarm fror Engine 7 Tage ein - gehaertet
      d: 'BEFUND 2026-07-14 - die Momentum-Engine war seit 07-07 tot, ohne dass es jemand merkte.
        Ursache - Alpaca lieferte kurz "equity = nur Cash" (Positionen nicht geladen); der
        Circuit-Breaker las das als -98% Drawdown, schrieb data/.KILL und fror alles ein. Der
        Alarm ging ueber send_info -> unter ACTION_ONLY stumm, erreichte Mert nie. Derselbe Glitch
        schrieb Muell-Equity-Snapshots (2439$) und loeschte alle Positionen aus der DB (opened_at weg).
        FIX (PR #13) - (1) Plausibilitaets-Waechter im Circuit-Breaker - Drawdown < -60% ODER 0
        gemeldete Positionen = Datenfehler, KEIN Kill (echter -30%-Crash eines 5-Titel-Depots
        erzeugt nie in einem Schritt < -60%); (2) echter Trip alarmiert jetzt via
        send_action_required (erreicht Mert); (3) sync_positions ueberspringt den Zyklus, wenn der
        Broker 0 Positionen trotz bestuecktem Depot meldet (kein Muell-Snapshot, keine Loeschung).
        SOFORT lokal - Fehlalarm-.KILL entfernt (Engine laeuft wieder), 3 Muell-Zeilen geloescht,
        opened_at auf 01.07. korrigiert. Lehre - ein stiller Not-Aus ist so gefaehrlich wie kein
        Not-Aus; kritische Halts brauchen einen lauten Kanal + einen Selbstheil-/Erkennungs-Pfad.'
      badge: 2026-07-14
    - t: Deploy startet die Webapp jetzt selbst neu + 10 stumme Jobs bekommen Fehleralarm
      d: 'BEFUND 2026-07-27 - zwei Luecken in der Betriebssicherheit. (1) auto_pull startete nach
        einem Deploy nichts neu. Bei den oneshot-Timern stimmt das (die holen den neuen Code beim
        naechsten Lauf), die Webapp laeuft aber DURCH und behielt ihren alten Code - teils ueber
        Wochen. Jede Webapp-Aenderung brauchte einen manuellen Neustart, den nur Mert ausloesen
        kann (investpi hat kein sudo dafuer). (2) Von 23 Services hatten nur 3 einen OnFailure-
        Alarm - u.a. rebalance (Stop-Loss-Pass!), sync (Broker-Abgleich) und backup konnten still
        ausfallen. FIX - (1) systemd_sync.sh bekommt einen zweiten Modus "--restart <unit>" gegen
        eine FEST VERDRAHTETE Liste (nur webapp + terminal); auto_pull ruft ihn, wenn der Pull
        webapp/ oder src/ angefasst hat. Die Liste ist bewusst hart - das Skript laeuft als root
        und sein Argument kaeme sonst aus einem Repo, das automatisch von GitHub zieht. Sudoers
        blieb unveraendert (die Regel erlaubt Argumente bereits). (2) OnFailure ergaenzt bei sync,
        rebalance, backup, outcomes, ai-swing, ai-swing-outcomes, monthly-dca, operator,
        dca-watchdog, auto-pull -> 13 von 23. Spam-Risiko ist gedeckelt, error_alert.sh hat 1h
        Cooldown pro Service. Bewusst OHNE Alarm - status-push, telegram-callbacks, hardware
        (alarmiert selbst) und die reinen Report-Jobs (ausbleibender Report ist selbst das Signal).
        Lehre - ein Deploy, der den laufenden Prozess nicht anfasst, ist nur ein halber Deploy.'
      badge: 2026-07-27
    - t: DCA-Verkaufs-Alerts mit Aktions-Buttons + Ersatz-Vorschlag
      d: 'Watchdog-Sell-Alerts liefen bisher ueber send_info und waren unter ACTION_ONLY stumm -
        erreichten Mert nicht. Neu: send_action_required mit Buttons verkauft/behalten. Verkauft ->
        Position raus aus config.yaml + dca_sold-Feedback (Watchdog stoppt) + automatischer
        Sonnet-Ersatzvorschlag (Einzeltitel/ETF) mit Kauf-Buttons. Handler dsell in
        telegram_callbacks. ORCL (bereits verkauft) aus der Ueberwachung genommen; PG bleibt. Via PR #12.'
      badge: 2026-07-10
    - t: DCA-ETFs auf Revolut-kaufbare UCITS umgestellt (SPYL/VWCE/EQQQ)
      d: 'Der monatliche DCA-Job durfte bisher nur US-ETFs empfehlen (SPY/QQQ/SMH/XLK/XLV/XLF) -
        in der EU auf Revolut NICHT handelbar, also fuer Mert totes Papier. Neu: nur 3 in EUR/Xetra
        auf Revolut kaufbare UCITS - SPYL.DE (S&P500), VWCE.DE (FTSE All-World), EQQQ.DE (Nasdaq-100);
        dca_fallback_etf SMH -> VWCE.DE. Zusaetzlich Bug behoben: bei ETF-Empfehlung wurde das Feld
        alternative_etf gebucht statt der empfohlenen ticker (Anzeige != Buchung). Telegram-Text jetzt
        immer "Monatlicher Invest-Vorschlag" (ETF o. Einzeltitel) statt "ETF-Fallback". Via PR #10.'
      badge: 2026-07-03
    - t: KI-Swing live auf 2. Paper-Konto gegangen (Phase 3, mit Sicherheits-Käfig)
      d: 'Ausfuehrungs-Adapter (scripts/ai_swing_execute.py) nimmt die juengste KI-Wochenentscheidung,
        baut einen gleichgewichteten Korb (max 12 Titel) und ordert aufs 2. Alpaca-Paper-Konto,
        strikt getrennt vom Momentum (source=ai_swing, strategy_label=ai_swing-v1). Sicherheits-Kaefig
        rein deterministisch, KI liefert KEINE Zahlen: Whitelist-Gate (fail-closed), 95% Invest /
        5% Cash-Floor, 15%-Einzel-Kappe, nur aus Cash (nie Margin), Not-Aus .KILL_ai, Open-Order-Guard
        (keine gestapelten Orders bei geschlossener Boerse), Konto-DB-Abgleich vor jeder Order. Eigener
        Sync (ai_swing_sync.py) + Webapp-Ansicht KI-Swing (3-Wege-Vergleich vs Momentum vs SPY).
        BEWUSSTE Abweichung vom Konzept: live-paper VOR dem Schatten-IC-Nachweis gestartet, weil Mert
        echte Vorwaerts-Daten sehen will (Spielgeld, kein Geld-Risiko) - die Schatten-Messung laeuft
        parallel weiter. V1-Vereinfachung: gleichgewichtet statt ATR-Risiko-Sizing; voller Fuzzing-
        Haertetest (Konzept-Phase 2) noch OFFEN. Erster echter Kauf 2026-07-03 (9 Titel, Orders queued
        ueber Feiertags-Wochenende -> Fill Montag). Timer: execute So 16:30, sync stuendl. :40.'
      badge: 2026-07-03
    - t: KI-Swing-Trader als 2. Paper-Konto geplant (Konzept festgehalten)
      d: 'Ein zweiter, getrennter KI-Trader (LLM-Tilt) auf eigenem Alpaca-Paper-Konto soll fair gegen die
        Momentum-Engine UND SPY/QQQ antreten - Swing/Position (Tage-Wochen), abgegrenzt vom Intraday-DayPi.
        KI gibt NUR Namen+conviction+These aus, alle Zahlen/Stops/Caps macht deterministischer Code (kein
        LLM als Sicherheits-Gate). Ehrliche Erwartung: schlaegt Markt wahrscheinlich NICHT (Score-Aera +
        Forschungslage) -> billig bauen, fair messen, ohne Reue verwerfen. Bauplan korrigiert nach
        adversarialer Kritik: (1) Whitelist NICHT momentum-vorgefiltert (sonst Momentum-Klon, kann ihn nicht
        schlagen) -> breit nach Liquiditaet/Sektor; (2) billiger Schatten-Signal-Test (IC>0?) ZUERST, Kaefig
        erst danach; Lern-System erst wenn Phase 3 Puls zeigt, NICHT waehrend des Mess-Fensters
        (Stationaritaets-Freeze). Erfolgskriterium vorab einfrieren, Urteil erst nach 24-36 Mon. Volldetails:
        AI_SWING_TRADER_CONCEPT.md. STAND - 2. Konto angelegt+getestet, Erfolgskriterium eingefroren,
        News-Coverage-Test bestanden, Phase-1-Schatten gebaut (scripts/ai_swing_shadow.py + _outcomes.py,
        eigene DB data/ai_swing.db) und Tag-0-Entscheidung gesetzt. Umgesetzt 2026-07-03: live-paper aktiv, Timer scharf (s. neue Karte oben).'
      badge: 2026-06-26
    - t: Risiko-Toleranz festgelegt - pur Momentum (kein Low-Vol-Blend)
      d: Mert wuerde einen zwischenzeitlichen Drawdown von ~-35% aushalten ohne zu verkaufen. Daher bleibt es
        bei PUREM Momentum (volle Rendite), keine Low-Vol-Beimischung - die haette ~9 Punkte Rendite/J gegen
        ~5 Punkte weniger Drawdown getauscht, was sich nur lohnt, wenn man im Crash NICHT ruhig haelt. Caveat -
        auf Spielgeld leicht gesagt; echter Test ist ein echter Crash. Low-Vol-Werkzeug (factor2_lowvol_study.py)
        bleibt als Option im Schrank, falls sich das Verhalten live anders zeigt.
      badge: 2026-06-24
    - t: Cruft entfernt (Repo-Seite)
      d: Tote Alt-Timer-Units (strategy/-open/-close, train-regime, patterns, meta-review) aus dem Repo
        ausgemustert, Status-Snapshot von toten 'score'-Eintraegen bereinigt, setup-Hinweis auf lebende
        Momentum-Timer korrigiert. Nichts Aktives betroffen (Smoke gruen). Score-Code bleibt Referenz.
        Live am Pi nachgezogen - rotation-Timer abgeschaltet + 13 /etc-Altlast-Dateien geloescht (sudo durch Mert).
      badge: 2026-06-24
    - t: Sicherungsluecke geschlossen
      d: Lebende Units operator, monthly-digest, webapp, terminal lagen nur in /etc, NICHT im Repo - bei
        Neuaufsetzen via setup_pi.sh waeren sie verloren gewesen; jetzt byte-identisch versioniert. Dabei
        zwei weitere tote Score-/etc-Units gefunden (universe-screener, weekly-mini-review) - deaktiviert,
        schaden nicht, /etc-Purge per sudo noch offen.
      badge: 2026-06-24
    - t: Momentum scharfgeschaltet
      d: engine=momentum ersetzt das Score-System. Grund - Score schlug den Markt nachweislich nicht
        (Risiko-Vorhersage schlechter als Dummy); Momentum lag 2018–2026 in 7/9 Jahren vorn bei geringerem
        Drawdown.
      badge: 2026-06-23
    - t: Weniger handeln, mehr halten
      d: Backtest ueber Auf- und Abschwung — aktives Verkaufen war in KEINEM Regime besser als ruhiges
        Halten. Schutz kommt aus Diversifikation, nicht aus haeufigem Handeln. momentum_exit entschaerft.
      badge: 2026-06-23
    - t: Score-/Lern-Timer abgeschaltet
      d: Self-Learning-Timer (score, regime, patterns, meta/mini-review, screener) deaktiviert — sie
        optimierten ein totes System und kosteten LLM-Geld.
      badge: 2026-06-24
    - t: Momentum produktions-gehaertet
      d: Audit-Haertung - Daten-Sanity, Cross-Check, Mindestabdeckung, Circuit-Breaker, Market-Orders,
        Stale-Cleanup, atomarer State; nicht handeln solange Orders offen.
      badge: 2026-06-24
    - t: Universum verbreitert
      d: Auf breite handelbare Large-Caps erweitert (u.a. CAT/TGT/GS/SLB) — mehr Auswahl fuer das
        Momentum-Ranking, weniger Klumpenrisiko.
      badge: 2026-06-23
    - t: Regime-Schalter verworfen
      d: 200d-MA-Filter (SPY unter Trend, dann Cash) per Backtest getestet (regime_overlay_check.py) —
        macht ALLES schlechter (2018-26 Rendite +30,5% auf +16,4%, MaxDD -18% auf -32%; Whipsaw - verkauft
        im Dip, verpasst Bounce). Bestaetigt - Timing schadet, Halten gewinnt. Momentum bleibt PUR.
      badge: 2026-06-24
    - t: Edge nach Steuer bestaetigt
      d: tax_check.py - Momentum Top-5 netto +27,1%/J vs SPY +11,4%/J, also +15,8%/J Vorsprung NACH
        deutscher Abgeltungssteuer. Steuer frisst nur ~6 Punkte; Edge ueberlebt klar. Robustness - 7/9
        Jahre und 70% der 12M-Fenster ueber Markt, MaxDD niedriger als SPY.
      badge: 2026-06-24
    - t: Zweiter Faktor (Low-Vol) geprueft - echte Diversifikation, aber teuer
      d: Low-Vol als zweiten, von Momentum unabhaengigen Faktor backtestet (scripts/factor2_lowvol_study.py,
        Train/Test-Split + Korrelation). Korrelation der Monatsrenditen nur 0,26 - also echt unkorreliert. Eine
        60/40-Mischung Momentum+LowVol senkt den MaxDD 2018-26 von -18% auf -13% bei minimal besserer Sharpe
        (1,15 vs 1,13) und besteht Out-of-Sample in BEIDEN Haelften. ABER kostet viel Rendite (21,6% vs 30,8%/J),
        weil LowVol in starken Momentum-Jahren hart bremst (2023 Momentum +58% vs Blend +26%). Und 2018-26 enthielt
        KEINEN Momentum-Crash - der eigentliche Schutznutzen bleibt ungetestet. Fazit - kein Selbstlaeufer, sondern
        Rendite-gegen-Ruhe-Abwaegung; Entscheidung vertagt auf Merts Risiko-Toleranz. Live unveraendert (pur Momentum).
      badge: 2026-06-24
    - t: Strategie-Varianten getestet, keine robuste Verbesserung
      d: 12-1-Momentum, Quartals-Rebalance und Ranking-Puffer geprueft (variant_check / turnover_buffer).
        Headline-Zahlen hoeher, aber nicht robust - 12-1 lumpy (schlaegt Markt nur 6/9 J vs 7/9), Quartal
        ist Mess-Artefakt, Puffer nicht-monoton (Rauschen). Lookback-Sweep 3-12M bestaetigt - Grundedge
        ist breit/robust. Live-Stand (6M Top-5 monatl.) bleibt - die 'Verbesserungen' waeren Overfitting.
      badge: 2026-06-24
    - t: Universum war nie der Hebel (Korrektur)
      d: Erst vermutet - Live-Universum eng/KI-kuratiert (~41). FALSCH - das ist die config.yaml-Ringliste
        (nur DCA + tote Score-Engine). Die Live-Momentum-Engine nutzt seit jeher den breiten, branchen-
        gestreuten 90-Namen-Korb; Diversifikation also schon da. Einzige reale Schwaeche - der Korb lag in
        einer Backtest-Datei; jetzt eigene Quelle src/common/universe.py (Live+Backtest identisch). Verhalten unveraendert.
      badge: 2026-06-24
    - t: Live-Rückstand analysiert - kein Defekt, keine belegbare Verbesserung
      d: 'Anlass - Live-Paper 29.04.-18.08.2026 nur -1,2% (USD) gegen SPY +8,8%, also ~10 Punkte Rückstand.
        BEFUND - die Ursache ist EIN Monat, nicht das System. Juli-Korb (AMD/CSCO/C/CAT/TXN) -8,3% gegen
        SPY +1,6%; klassischer Momentum-Reversal - die hoch-momentigen Titel kippten breit (MU -20%,
        INTC -28%, CAT -16%). August-Korb (AMD/CSCO/MU/INTC/UNH) +6,7% gegen SPY +2,0%, Engine also intakt.
        AUSFÜHRUNG SAUBER - Depot-Verlauf folgt dem Korb (Juli Depot -7,0% vs Korb -8,3%), Cash-Drag nur
        2,5-4%, kein Leck. EINORDNUNG - im Backtest liegen 36% aller 4-Monats-Fenster hinter dem Markt,
        6% davon >=10 Punkte, schlechtestes -19 Punkte. Der aktuelle Stand ist damit NORMALES Verhalten
        der bewiesenen Strategie, kein Signal. VARIANTEN GETESTET (Sweep 2018-26, beide Hälften,
        Jahres-Trefferquote) - Top-3 (35,0%/Sharpe 1,10), Top-5 LIVE (30,5%/1,13), Top-8 (24,6%/1,13),
        Top-10 (20,3%/1,00), Top-15 (21,3%/1,13), Sektor-Cap max2 bzw. max3 je Sektor (18,8-24,9%,
        MaxDD SCHLECHTER), 1/Vola-Gewichtung (16,9%/0,93). Top-5 gleichgewichtet ist Sharpe-Optimum UND
        Rendite-Optimum unter den robusten Varianten - jede Änderung wäre Verschlechterung. Top-8 bietet
        gleiche Sharpe bei MaxDD -15% statt -18%, kostet aber ~6 Punkte Rendite/J; bei Merts Zielsetzung
        (max. absolute Rendite) nicht gerechtfertigt. FEHLHYPOTHESE WIDERLEGT - Verdacht, der Live-Sanity-
        Filter MAX_6M_MOM=2,00 werfe echte Gewinner raus (Juli - MU +253% / INTC +241% wurden verworfen).
        Gegenrechnung - die echten Top-5 hätten im Juli -16,8% gemacht statt der gehaltenen -8,3%; der
        Filter hat GESPART. Backtest bestätigt - mit Cap 31,2%/Sharpe 1,17 vs ohne Cap 30,5%/1,13, griff
        in nur 5 von 101 Ticker-Monaten. Filter bleibt. ERGEBNIS - keine Änderung an der Strategie; der
        Rückstand ist auszusitzen, nicht wegzuoptimieren.'
      badge: 2026-08-18
    - t: 'DayPi-Tab: Gesamt-Zeitverlauf ergänzt'
      d: 'Der DayPi-Tab zeigte nur den Intraday-Verlauf des laufenden Tages (equity_curve),
        der jede Nacht wertlos wird - ausserhalb der US-Marktzeit stand die Karte leer.
        NEU - Umschalter Gesamt/Heute im selben Kartenrahmen; Gesamt ist Standard und liest
        equity_history aus der DayPi-Datenbrücke (/home/pi/daytrader/data/daypi_public.json,
        welt-lesbar, Doku docs/webapp-datenbruecke.md bei DayPi). Ein Punkt je Handelstag als
        KATEGORIE-Achse gezeichnet, nicht als echte Zeitachse - Wochenenden/Feiertage fehlen in
        den Daten und würden sonst Lücken reissen. Fläche zwischen Kurve und Startlinie
        (100k) grün darüber / rot darunter, Crosshair samt Tooltip (Datum, Kontostand, P/L seit
        Start, Abstand zum Hoch), Kennzahlen Handelstage/Hoch/max. Rückgang im Kartenkopf.
        Reines SVG ohne neue Abhängigkeit, Neuzeichnen nur bei geänderten Daten (der Tab
        aktualisiert alle 2 s - sonst bräche der Hover ständig ab). Kein Backend-Eingriff nötig,
        /api/daypi spiegelt das Snapshot bereits vollständig.'
      badge: 2026-08-18
    - t: Echtgeld bleibt gesperrt
      d: Kein echtes Geld vor Live-Beweis ueber mehrere Jahre + mind. 1 Crash. Bewusst konservativ.
      badge: Dauerregel
tech:
- - Sprache
  - Python 3.11 (nativ, kein Docker)
- - Datenhaltung
  - 5× SQLite — trading, learning, market, alerts, patterns
- - Scheduling
  - 15 aktive systemd-Timer · User investpi (Score-System + rotation deaktiviert)
- - Marktdaten
  - yfinance · fredapi (FRED)
- - ML / Regime
  - hmmlearn (HMM) · scikit-learn — unter Momentum ruhend (train-regime aus)
- - Broker
  - Alpaca SDK (Paper-Account)
- - Alerts
  - Telegram Bot API
- - Strategie-Engine
  - Momentum (6-Mon, Top-5 monatl.) + Risk-Limits aus config.yaml
- - KI-Reviews
  - Claude Opus 4.8 (ad-hoc Backtests/Audits; autom. Reviews unter Momentum aus)
- - Deploy
  - git auto-pull alle 2 Min → push = Live in <2 Min
protections:
- Stop-Loss
- Trailing-Stop
- Take-Profit
- Drawdown-Bremse
- Kill-Switch
- Cash-Reserve
- Sektor-Limit
- Korrelations-Check
- Tages-Verlust-Limit
