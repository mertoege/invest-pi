notes: 'EUR-denominiert, Paper-Trading. Ziel: maximale absolute Rendite — aber mit Risiko­abwägung, nicht
  gepokert. GRUNDAUSRICHTUNG 2026-06-23: Backtests über Auf- (2025/26) und Abschwung (2022) zeigten, dass aktives Verkaufen in KEINEM Regime besser war als ruhiges Halten (Aufwärts +16% aktiv vs +20% halten; Bär -17% vs -15%). Schutz im Abschwung kommt aus Diversifikation, nicht aus häufigem Handeln. Daher momentum_exit (zuvor 63% aller Verkäufe) entschärft Richtung weniger Handeln / mehr Halten. Universe auf 29 handelbare Werte verbreitert (CAT/TGT/GS/SLB). 2026-06-23 SCHARFGESCHALTET: strategy_engine=momentum — Momentum-Top-5 (monatlich) ersetzt die alte Score-Pipeline (no-op), beide alten Handels-Pfade (run_strategy, weekly_rotation) delegieren/beenden. Belegt via champion_duell_fair / robustness_check / tax_check. Das alte Self-Learning des Score-Systems ist ruhend (Timer aus). Weiter Spielgeld; Echtgeld erst nach langem Live-Beweis. 2026-07-02 MANDAT: Projekt vollstaendig KI-gesteuert — Mert entscheidet NUR Echtgeld-Umstieg + Projektkosten; alle Technik- UND Strategie-Entscheidungen bei Claude. Claude-Entscheidungen aus dem Fable5-Audit (ohne Mert-Freigabe): (a) Live-Strategie wird an den validierten Backtest angeglichen — uebergewichtete Gewinner monatlich trimmen (Equal-Weight wie im Beweis-Backtest), Kurs-Cache-Adjustierungs-Bug fixen (monatl. force_refresh), Sanity-Filter per Zweitquelle cross-checken statt hart+dauerhaft droppen; JEDE Trading-Aenderung vorher via champion_duell_fair/robustness_check backgetestet, sonst kein Live. (b) Claude legt die im Momentum-Pfad aktiven Risiko-Grenzen fest — portfolio-orientiert (Daily-Loss + Drawdown-Tiers + Cash-Floor), Circuit-Breaker auf USD; bewusst KONSERVATIV/wenig-Verkaufen, da Backtests zeigten dass haeufiges Verkaufen die Rendite kostet. Beide Punkte in Arbeit — Ergebnis wird berichtet, nicht zur Freigabe vorgelegt. STAND 2026-07-02 UMGESETZT+committet: Equal-Weight-Trimming der Gewinner (gegen Live-Depot validiert — fand AMD ~932 EUR ueber Ziel), Momentum-Order-Logging in trades, Doppel-Order-/Storno-/stiller-Ausfall-Fixes, Circuit-Breaker auf USD, Kurs-Cache-Adjustierungs-Bug (Split/Dividende, deterministisch getestet), OnFailure-Ausfall-Alarm. Datei-Rechte 2026-07-02 auf investpi vereinheitlicht (chown) -> keine Sperren mehr. OFFEN (kein Mert-Input, NICHT dringend): portfolio-Risiko-Limits fuer den Echtgeld-Pfad (Design+Backtest, an die Echtgeld-Entscheidung gekoppelt), Sanity-Filter-Cross-Check, EUR-Einstands-Drift im Reporting, kleinere Live-Bugs. Voller Audit: reviews/2026-07-02_fable5_audit.md. AUFGABEN AUSGEMISTET 2026-08-22: fuenf Eintraege geloescht, weil erledigt oder woanders zustaendig — Revolut-Gebuehr und "DCA-Depot melden" liegen seit der Uebergabe am 10.08. bei DepotPi (dort als Aufgaben vorhanden, hier Duplikate); "Anweisungen des Portfolio-Managers ausfuehren" ist gegenstandslos, da die Timer invest-pi-monthly-dca und invest-pi-dca-watchdog disabled sind und das echte Depot nicht mehr hier haengt; der Sparplan-PR ist als #18 gemergt (fix/sparplan-echte-analyse ist Vorfahr von main); die vier invest-pi-ai-swing-*-Timer sind installiert und enabled. NEU eingetragen: die zwei seit Wochen offenen PRs #24 und #14 — beide sind Merts Ball, weil der direkte Push auf main gesperrt ist. RISIKO aus dieser Pruefung: src/common/depot_stillgelegt.py existiert weder auf main noch im Arbeitsverzeichnis (steckt in PR #24), die Stilllegung haengt also allein an den deaktivierten Timern, deren systemd-Preset weiter auf enabled steht — ein systemctl preset macht den Portfolio-Manager wieder scharf. Ausserdem gehoerte manifest.yaml seit dem 20.08. root (0644) und war fuer die Projekt-Instanz nicht schreibbar; per Ersetzen wieder auf investpi gezogen — Ursache ist ein Pi-weites root-Skript, das die Datei neu schreibt. Der Jobs-Block fuehrte "Monats-Sparplan (DCA)" und "DCA-Watchdog" faelschlich als aktiv; auf gestoppt korrigiert. NACHTRAG 2026-08-22: PR #24 gemergt — die Depot-Stilllegung hat damit wieder beide Schutzwaelle (src/common/depot_stillgelegt.py plus die deaktivierten Timer); im Live-Lauf verifiziert, dass portfolio_manager.py und dca_watchdog.py vorne aussteigen. PR #14 dagegen UNGEMERGT GESCHLOSSEN, weil ueberholt: er wollte spy_close inline in sync_positions.py schreiben (Broker-Quote + yfinance-Fallback), doch der Ausfall wurde am 2026-08-09 mit Commit d87ab38a bereits zentral behoben — sync_positions.py ruft current_spy_close() aus src/common/performance.py. Nachgemessen in data/trading.db: in den letzten 14 Tagen haben 338/338 paper- und 337/337 ai_swing-Snapshots einen SPY-Wert, die Luecke ist also zu. Ein Merge haette nur den alten Inline-Pfad zurueckgebracht. Damit ist die Warnung "ohne #14 haengt die Abschaltregel in der Luft" widerlegt — sie stammte aus einer veralteten Notiz und wurde ungeprueft uebernommen.'
